# vcf-mcp configuration
#
# Each [[samples]] entry registers a VCF file that the MCP server can query.
# Paths must be absolute and point to a bgzipped VCF (.vcf.gz). No .tbi index
# file is required — the server builds the index in memory at startup (an
# existing .tbi alongside the file is used as a fast-load shortcut if present).
#
# This file is only one way to register samples; you can also add them at
# runtime by asking Claude ("add this VCF: <path>"), which calls add_sample.
#
# Copy this file to the OS-specific config location and edit:
#   Linux:   ~/.config/vcf-mcp/config.toml
#   macOS:   ~/Library/Application Support/vcf-mcp/config.toml
#   Windows: %APPDATA%\vcf-mcp\config.toml
#
# Or pass --config <path> on the command line.

[[samples]]
# Short, stable identifier the MCP client uses to refer to this sample.
name = "NA12878"

# Absolute path to a bgzipped VCF (.vcf.gz). No companion .tbi required.
vcf_path = "/data/giab/HG001_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"

# Genome build. Must be exactly "GRCh37" or "GRCh38".
build = "GRCh38"

# Free-text description shown to MCP clients in tool responses.
description = "GIAB NA12878 / HG001 benchmark calls, v4.2.1, chromosomes 1-22"

[[samples]]
name = "person_genome_001"
vcf_path = "/data/cohort/person_genome_001.somatic.vcf.gz"
build = "GRCh37"
description = "Example somatic call set"
