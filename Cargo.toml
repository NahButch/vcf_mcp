[package]
name = "vcf-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "MCP server for querying Variant Call Format (VCF) files"
repository = "https://github.com/NahButch/vcf_mcp"
readme = "README.md"
keywords = ["mcp", "vcf", "bioinformatics", "genomics", "variants"]
categories = ["command-line-utilities", "science::bioinformatics"]

[dependencies]
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
directories = "5"

noodles-core = "0.20"
noodles-vcf = "0.88"
noodles-tabix = "0.62"
noodles-bgzf = "0.47"
noodles-csi = "0.56"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "io-util", "process"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
